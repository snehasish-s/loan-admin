<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Wallet Balances</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="container mt-4">

    <h2 class="mb-4">Wallet Balances</h2>

    <table class="table table-bordered table-striped">
        <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Wallet Balance</th>
                <th>Add Money</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="beneficiary : ${beneficiaries}">
                <td th:text="${beneficiary.id}"></td>
                <td th:text="${beneficiary.name}"></td>
                <td th:text="${beneficiary.walletBalance}"></td>
                <td>
                    <form th:action="@{/wallet-add/{id}(id=${beneficiary.id})}" method="post" class="d-flex gap-2">
                        <input type="number" name="amount" min="1" placeholder="Amount" class="form-control form-control-sm" required>
                        <button type="submit" class="btn btn-primary btn-sm">Add</button>
                    </form>
                </td>
            </tr>
        </tbody>
    </table>

    <a href="/" class="btn btn-secondary mt-3">Back to Home</a>

</body>
</html>
