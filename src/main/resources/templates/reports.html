<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Reports</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="container mt-4">

    <h2 class="mb-4">Beneficiary Reports</h2>

    <div class="row mb-4">
        <div class="col-md-3">
            <div class="card text-bg-primary mb-3">
                <div class="card-body">
                    <h5 class="card-title">Total Beneficiaries</h5>
                    <p class="card-text" th:text="${totalBeneficiaries}"></p>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card text-bg-warning mb-3">
                <div class="card-body">
                    <h5 class="card-title">Pending</h5>
                    <p class="card-text" th:text="${pendingCount}"></p>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card text-bg-success mb-3">
                <div class="card-body">
                    <h5 class="card-title">Approved</h5>
                    <p class="card-text" th:text="${approvedCount}"></p>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card text-bg-danger mb-3">
                <div class="card-body">
                    <h5 class="card-title">Rejected</h5>
                    <p class="card-text" th:text="${rejectedCount}"></p>
                </div>
            </div>
        </div>
    </div>

    <h4>Total Wallet Balance: <span th:text="${totalWalletBalance}"></span></h4>

    <table class="table table-bordered table-striped mt-3">
        <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Aadhaar</th>
                <th>Bank Account</th>
                <th>IFSC</th>
                <th>Status</th>
                <th>Wallet Balance</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="beneficiary : ${beneficiaries}">
                <td th:text="${beneficiary.id}"></td>
                <td th:text="${beneficiary.name}"></td>
                <td th:text="${beneficiary.aadhaar}"></td>
                <td th:text="${beneficiary.bankAccount}"></td>
                <td th:text="${beneficiary.ifsc}"></td>
                <td th:text="${beneficiary.status}"></td>
                <td th:text="${beneficiary.walletBalance}"></td>
            </tr>
        </tbody>
    </table>

    <a href="/" class="btn btn-secondary mt-3">Back to Home</a>

</body>
</html>
