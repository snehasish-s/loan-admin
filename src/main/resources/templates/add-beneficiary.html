<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="'Add Beneficiary - ' + ${projectTitle}">Add Beneficiary</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* SBI Color Palette */
        :root {
            --sbi-blue: #0A3C93; /* Primary Deep Blue */
            --sbi-dark: #072e6f; /* Darker blue for backgrounds/footers */
            --sbi-light: #f5f5f5; /* Off-white for background */
            --sbi-accent: #008cd2; /* Lighter/Cyan Blue for accents/hover */
            --sbi-text: #333333; /* Dark text */
            --sbi-text-light: #ffffff; /* Light text */
            --shadow-color: rgba(0, 60, 147, 0.2); /* Blue shadow */
            
            /* Standard variables for Bootstrap components */
            --primary: var(--sbi-blue);
            --secondary: #6c757d;
            --success: #28a745;
            --danger: #dc3545;
        }
        
        body {
            background-color: var(--sbi-light);
            color: var(--sbi-text);
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
            padding-bottom: 40px;
        }
        
        .header {
            background-color: var(--primary);
            color: var(--sbi-text-light);
            padding: 25px 20px;
            text-align: left; 
            box-shadow: 0 4px 15px var(--shadow-color);
            border-bottom: 5px solid var(--sbi-accent);
            margin-bottom: 30px;
            display: flex;
            align-items: center;
        }
        
        .logo-container { 
            width: 50px; 
            height: 50px; 
            margin-right: 15px; 
            display: inline-block; 
            vertical-align: middle;
        }
        
        .header h2 {
            font-weight: 600;
            margin: 0;
            padding-left: 0;
        }

        .form-container {
            background-color: white;
            border-radius: 10px; 
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            padding: 40px;
            margin-top: 20px;
            position: relative;
            max-width: 800px;
            margin-left: auto;
            margin-right: auto;
            border: 1px solid #e0e0e0;
        }
        
        .form-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 5px;
            height: 100%;
            background-color: var(--primary); 
        }
        
        .form-title {
            color: var(--primary);
            font-weight: 700;
            margin-bottom: 25px;
            position: relative;
            padding-bottom: 10px;
        }
        
        .form-title::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 70px; 
            height: 3px;
            background-color: var(--sbi-accent); 
        }
        
        .form-label {
            font-weight: 500;
            color: var(--sbi-text);
            margin-bottom: 8px;
            transition: color 0.3s;
        }
        
        .form-control {
            border: 1px solid #ced4da; 
            border-radius: 5px; 
            padding: 10px 15px;
            transition: all 0.2s;
            font-size: 15px;
        }
        
        .form-control:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 0.25rem rgba(10, 60, 147, 0.2); 
        }
        
        .btn-success {
            background-color: var(--success);
            border: none;
            border-radius: 5px;
            padding: 10px 25px;
            font-weight: 500;
            transition: all 0.2s;
            box-shadow: 0 2px 5px rgba(40, 167, 69, 0.2);
        }
        
        .btn-success:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(40, 167, 69, 0.3);
            background-color: #1e7e34;
        }
        
        .btn-secondary {
            background-color: var(--secondary);
            border: none;
            border-radius: 5px;
            padding: 10px 25px;
            font-weight: 500;
            transition: all 0.2s;
            box-shadow: 0 2px 5px rgba(108, 117, 125, 0.2);
        }
        
        .btn-secondary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(108, 117, 125, 0.3);
            background-color: #5a6268;
        }
        
        .alert-success {
            border: 1px solid #c3e6cb;
            border-left: 5px solid var(--success);
            border-radius: 5px;
            background-color: #d4edda;
            color: #155724;
            box-shadow: 0 2px 8px rgba(40, 167, 69, 0.1);
        }
        
        /* Animation Keyframes */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        @keyframes slideInLeft {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }
        
        @keyframes slideInRight {
            from {
                opacity: 0;
                transform: translateX(20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }
        
        @keyframes zoomIn {
            from {
                opacity: 0;
                transform: scale(0.9);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }
        
        /* Animation Classes */
        .fade-in-up {
            animation: fadeInUp 0.6s ease-out forwards;
        }
        
        .slide-in-left {
            animation: slideInLeft 0.6s ease-out forwards;
        }
        
        .slide-in-right {
            animation: slideInRight 0.6s ease-out forwards;
        }
        
        .zoom-in {
            animation: zoomIn 0.6s ease-out forwards;
        }
        
        .input-icon {
            position: relative;
        }
        
        .input-icon i {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #a9a9a9;
            transition: color 0.3s;
        }
        
        .form-control:focus ~ i { 
            color: var(--primary);
        }
        
        footer {
            margin-top: 60px;
            padding: 20px;
            background-color: var(--sbi-dark);
            color: var(--sbi-text-light);
            text-align: center;
            font-size: 0.9rem;
            box-shadow: 0 -4px 15px var(--shadow-color);
        }
        
        /* Responsive adjustments */
        @media (max-width: 768px) {
            .form-container {
                padding: 20px;
            }
            
            .header h2 {
                font-size: 1.2rem;
            }
            
            .header {
                padding: 15px 10px;
            }
        }
    </style>
</head>
<body>

<div class="header d-flex align-items-center">
    <div class="logo-container">
        <svg width="50" height="50" viewBox="0 0 50 50" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="25" cy="25" r="25" fill="white"/>
            <circle cx="25" cy="25" r="22" fill="var(--sbi-blue)"/>
            <path d="M15 25C15 19.4772 19.4772 15 25 15C30.5228 15 35 19.4772 35 25C35 30.5228 30.5228 35 25 35C19.4772 35 15 30.5228 15 25Z" fill="white"/>
            <rect x="23" y="20" width="4" height="10" fill="var(--sbi-blue)"/>
        </svg>
    </div>
    <h2>Loan Utilization Tracking - Add Beneficiary</h2>
</div>

<div class="container">
    <div class="form-container fade-in-up" style="animation-delay: 0.2s;">
        <h3 class="form-title">Add New Beneficiary</h3>

        <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>

        <form th:action="@{/add-beneficiary}" th:object="${beneficiary}" method="post">
            <div class="row form-row mb-3">
                <div class="col-md-12">
                    <label for="name" class="form-label slide-in-left" style="animation-delay: 0.3s;">Full Name</label>
                    <div class="input-icon slide-in-left" style="animation-delay: 0.4s;">
                        <input type="text" id="name" th:field="*{name}" class="form-control" placeholder="Enter full name" required>
                        <i class="bi bi-person-fill"></i>
                    </div>
                </div>
            </div>
            
            <div class="row form-row mb-3">
                <div class="col-md-12">
                    <label for="aadhaar" class="form-label slide-in-right" style="animation-delay: 0.5s;">Aadhaar / ID</label>
                    <div class="input-icon slide-in-right" style="animation-delay: 0.6s;">
                        <input type="text" id="aadhaar" th:field="*{aadhaar}" class="form-control" placeholder="Enter Aadhaar or ID number" required>
                        <i class="bi bi-card-text"></i>
                    </div>
                </div>
            </div>
            
            <div class="row form-row mb-3">
                <div class="col-md-12">
                    <label for="bankAccount" class="form-label zoom-in" style="animation-delay: 0.7s;">Bank Account Number</label>
                    <div class="input-icon zoom-in" style="animation-delay: 0.8s;">
                        <input type="text" id="bankAccount" th:field="*{bankAccount}" class="form-control" placeholder="Enter bank account number" required>
                        <i class="bi bi-credit-card-fill"></i>
                    </div>
                </div>
            </div>
            
            <div class="row form-row mb-3">
                <div class="col-md-12">
                    <label for="ifsc" class="form-label slide-in-left" style="animation-delay: 0.9s;">IFSC Code</label>
                    <div class="input-icon slide-in-left" style="animation-delay: 1.0s;">
                        <input type="text" id="ifsc" th:field="*{ifsc}" class="form-control" placeholder="Enter IFSC code" required>
                        <i class="bi bi-building"></i>
                    </div>
                </div>
            </div>
            
            <div class="row form-row">
                <div class="col-md-12 d-flex gap-3 mt-4">
                    <button type="submit" class="btn btn-success slide-in-right" style="animation-delay: 1.1s;">
                        <i class="bi bi-person-plus-fill me-2"></i>Add Beneficiary
                    </button>
                    <a th:href="@{/}" class="btn btn-secondary zoom-in" style="animation-delay: 1.2s;">
                        <i class="bi bi-arrow-left-circle me-2"></i>Back to Dashboard
                    </a>
                </div>
            </div>
        </form>
    </div>
</div>

<footer>
    <p class="mb-0">Demo Web Admin – Hackathon SIH25149 | Secure Banking Solutions</p>
    <p class="mb-0 small mt-1">Inspired by State Bank of India's corporate theme.</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        // Success message animation/timeout
        const successAlert = document.querySelector('.alert-success');
        if (successAlert) {
            setTimeout(() => {
                successAlert.style.opacity = '0';
                successAlert.style.transition = 'opacity 0.5s';
                setTimeout(() => {
                    successAlert.style.display = 'none';
                }, 500);
            }, 5000);
        }

        // Label color change on input focus/blur
        const inputs = document.querySelectorAll('.form-control');
        inputs.forEach(input => {
            const parentCol = input.closest('.col-md-12');
            if (!parentCol) return; 
            
            const label = parentCol.querySelector('.form-label');
            if (!label) return; 

            input.addEventListener('focus', function() {
                label.style.color = 'var(--primary)';
            });
            
            input.addEventListener('blur', function() {
                if (this.value === '') {
                    label.style.color = 'var(--sbi-text)';
                }
            });
        });
    });
</script>
</body>
</html>
