<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Pending Transactions</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <style>
        /* Custom Styles for Blue/White Theme and Animation */
        body {
            /* Set a light blue background for the body */
            background-color: #f0f8ff; /* Alice Blue */
        }
        .table-blue-theme thead {
            /* Darker blue header */
            background-color: #007bff; /* Primary Blue */
            color: white;
            border-color: #0056b3;
        }
        .table-blue-theme tbody tr:nth-child(even) {
            /* Subtle alternating row color */
            background-color: #e9f5ff; /* Lighter Blue */
        }
        .table-blue-theme tbody tr:hover {
            /* Hover animation: slight scale and background change */
            background-color: #cfe2ff; /* Even Lighter Blue */
            transform: scale(1.005);
            transition: transform 0.2s ease-in-out, background-color 0.2s ease-in-out;
            box-shadow: 0 4px 8px rgba(0, 123, 255, 0.1); /* Subtle blue shadow */
        }
        .btn-sm {
            /* Animation for buttons on hover */
            transition: all 0.2s ease;
        }
        .btn-success:hover {
            transform: translateY(-1px);
            box-shadow: 0 2px 5px rgba(40, 167, 69, 0.3);
        }
        .btn-danger:hover {
            transform: translateY(-1px);
            box-shadow: 0 2px 5px rgba(220, 53, 69, 0.3);
        }
        .badge.bg-warning {
            /* Slightly more visible badge background and text */
            background-color: #ffc107 !important;
            color: #343a40 !important;
            animation: pulse 1.5s infinite; /* Added a pulsing animation to the status badge */
        }

        /* Keyframes for the pulse animation */
        @keyframes pulse {
            0% {
                box-shadow: 0 0 0 0 rgba(255, 193, 7, 0.4);
            }
            70% {
                box-shadow: 0 0 0 10px rgba(255, 193, 7, 0);
            }
            100% {
                box-shadow: 0 0 0 0 rgba(255, 193, 7, 0);
            }
        }
    </style>
</head>
<body class="container mt-4">

    <h2 class="mb-4 text-primary">Pending Transactions</h2>

    <table class="table table-bordered table-striped table-hover table-blue-theme">
        <thead class="table-blue-theme">
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Aadhaar</th>
                <th>Bank Account</th>
                <th>IFSC</th>
                <th>Status</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="beneficiary : ${pendingBeneficiaries}">
                <td th:text="${beneficiary.id}"></td>
                <td th:text="${beneficiary.name}"></td>
                <td th:text="${beneficiary.aadhaar}"></td>
                <td th:text="${beneficiary.bankAccount}"></td>
                <td th:text="${beneficiary.ifsc}"></td>
                <td>
                    <span class="badge bg-warning text-dark" th:text="${beneficiary.status}"></span>
                </td>
                <td class="d-flex gap-1">
                    <form th:action="@{/approve/{id}(id=${beneficiary.id})}" method="post">
                        <button type="submit" class="btn btn-primary btn-sm">Approve</button>
                    </form>

                    <form th:action="@{/reject/{id}(id=${beneficiary.id})}" method="post">
                        <button type="submit" class="btn btn-danger btn-sm">Reject</button>
                    </form>
                </td>
            </tr>
        </tbody>
    </table>

    <a href="/" class="btn btn-info mt-3">Back to Home</a>

</body>
</html>
