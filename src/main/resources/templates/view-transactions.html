<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Transaction Details</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="container mt-4">

    <h2 class="mb-4">Transaction Details</h2>

    <table class="table table-bordered table-striped">
        <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Beneficiary ID</th>
                <th>Type</th>
                <th>Amount</th>
                <th>Metadata</th>
                <th>Photo</th>
                <th>Video</th>
                <th>AI Fraud Status</th>
                <th>Timestamp</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="tx : ${transactions}">
                <td th:text="${tx.id}"></td>
                <td th:text="${tx.beneficiary.id}"></td>
                <td th:text="${tx.type}"></td>
                <td th:text="${tx.amount}"></td>
                <td th:text="${tx.metadata}"></td>
                <td>
                    <img th:if="${tx.photoPath != null}" th:src="@{${tx.photoPath}}" 
                         alt="Photo" style="width:80px;height:80px;">
                    <span th:if="${tx.photoPath == null}">No Photo</span>
                </td>
                <td>
                    <video th:if="${tx.videoPath != null}" controls style="width:120px;height:80px;">
                        <source th:src="@{${tx.videoPath}}" type="video/mp4">
                        Your browser does not support the video tag.
                    </video>
                    <span th:if="${tx.videoPath == null}">No Video</span>
                </td>
                <td th:text="${tx.aiFraudStatus}"></td>
                <td th:text="${#dates.format(tx.timestamp,'dd-MM-yyyy HH:mm:ss')}"></td>
            </tr>
        </tbody>
    </table>

    <a href="/" class="btn btn-secondary mt-3">Back to Dashboard</a>

</body>
</html>
